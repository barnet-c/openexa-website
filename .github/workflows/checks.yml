name: Checks

# Runs the repo's own checks on every pull request (and on main), so the heavy browser suites run here rather than on
# anyone's PC. Deploys are separate: azure-static-web-apps-thankful-mushroom-0dd42611e.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Generated files, links, content rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the sitemap's lastmod dates come from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Generated pages match their generators
        run: |
          python tools/build_blog.py
          python tools/build_research.py
          python tools/build_team.py
          python tools/launch_meta_v9.py
          git diff --stat
          git diff --exit-code -- '*.html' '*.xml' '*.json' '*.txt' '*.webmanifest' || {
            echo "::error::A generated file differs from what its generator writes: edit the generator or its data, rerun it, commit both."; exit 1; }
      - run: python tools/linkcheck_tree.py
      - run: python tools/check_static.py

  browser:
    name: Browser checks (Playwright)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 40  # round 1's verify_v9 guards add about 9 minutes under CI's software GL (tests report)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: verify_v9 and verify_editorial against the Azure-like preview (tools/serve.py)
        run: |
          python tools/serve.py > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8125/ > /dev/null && break; sleep 0.5; done
          python tools/verify_v9.py
          python tools/verify_editorial.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .shots/
          retention-days: 7

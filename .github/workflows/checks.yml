name: Checks

# Runs the repo's own checks on every pull request (and on main), so the heavy browser suites run here rather than on
# anyone's PC. Deploys are separate: azure-static-web-apps-thankful-mushroom-0dd42611e.yml.
#
# The browser checks run in parallel shards (round 2): one job per group of verify_v9 checks, each with its own
# tools/serve.py, plus verify_editorial in a job of its own. Every shard has a 25-minute limit and none stops the others
# (fail-fast: false). The static job checks that every verify_v9 check sits in exactly one shard (verify_v9.py --shards).
# To reproduce a shard on a PC, under CI's conditions (software GL, a slow CPU):
#   python tools/serve.py 8125                                   (another terminal)
#   python tools/verify_v9.py --swiftshader --cpu-throttle 4 --only <that shard's list>
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Generated files, links, content rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the sitemap's lastmod dates come from git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Generated pages match their generators
        run: |
          python tools/build_blog.py
          python tools/build_research.py
          python tools/build_team.py
          python tools/launch_meta_v9.py
          git diff --stat
          git diff --exit-code -- '*.html' '*.xml' '*.json' '*.txt' '*.webmanifest' || {
            echo "::error::A generated file differs from what its generator writes: edit the generator or its data, rerun it, commit both."; exit 1; }
      - run: python tools/linkcheck_tree.py
      - run: python tools/check_static.py
      - name: Every verify_v9 check sits in exactly one browser shard
        run: python tools/verify_v9.py --shards .github/workflows/checks.yml

  browser:
    name: verify_v9 · ${{ matrix.shard }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pages
            only: pages,no_js,no_webgl,faux_bold,tables_phone,reflow_400,print_home
          - shard: home
            only: home,interior,resolution,phone,reduced_motion,loader,proof_entrance
          - shard: overture
            only: overture_reentry,overture_relay,overture_numeral,overture_tap,overture_resize,overture_ctx_lost
          - shard: overture-phones
            only: overture_phones
          - shard: overture-rest
            only: overture_rest
          - shard: swarm
            only: swarm_rate,swarm_trace_to_ledger,platform_trace,platform_lab,lab_gate_labels
          - shard: ledger
            only: ledger_height,ledger_wheel,ledger_time,counters,nav_handoff
          - shard: nav
            only: nav_readout,jump_touch,label_in_name,forced_focus
          - shard: desk-pages
            only: desk,desk_warm_start,desk_phone_follow,lifecycle_lane_home,lifecycle_lane_steps,access,company,blog,platform_spec,grid_slab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: verify_v9 --only ${{ matrix.only }}
        run: |
          python tools/serve.py > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8125/ > /dev/null && break; sleep 0.5; done
          python tools/verify_v9.py --swiftshader --only "${{ matrix.only }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.shard }}
          path: .shots/
          retention-days: 7
          if-no-files-found: ignore

  editorial:
    name: verify_editorial
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: verify_editorial against the Azure-like preview (tools/serve.py)
        run: |
          python tools/serve.py > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8125/ > /dev/null && break; sleep 0.5; done
          python tools/verify_editorial.py --swiftshader
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-editorial
          path: .shots/
          retention-days: 7
          if-no-files-found: ignore
